name: 问题反馈 / Bug report
description: 报告可复现的问题，请勿包含真实密钥。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: '请使用公开演示密钥。漏洞请前往 Security 私密报告。'
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 页面、操作，以及公开测试数据。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器、系统和版本 / Environment
      placeholder: Chrome / Safari / Firefox，系统版本，提交或部署版本
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据检查 / Data check
      options:
        - label: 内容与附件不包含真实密钥、二维码、令牌或备份。
          required: true
