name: 功能建议 / Feature request
description: 描述使用场景与希望改善的操作。
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题 / Problem
      description: 你正在完成什么操作，哪一步不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议 / Proposal
      description: 希望怎样改善？可以补充考虑过的替代方案。
    validations:
      required: true
